async function loadTopProjects(){try{const cached=JSON.parse(localStorage.getItem('airgem.home.projects.v1')||'null');if(Array.isArray(cached?.trending))topProjectIds=cached.trending.slice(0,10)}catch{}
renderProjectChoices();try{if(typeof dropyClient!=='undefined'){const result=await dropyClient.from('site_trending_items').select('project_id,position').order('position',{ascending:true}).limit(10);if(!result.error){topProjectIds=(result.data||[]).map(x=>x.project_id)}else{const legacy=await dropyClient.from('site_trending').select('project_id').eq('slot',1).maybeSingle();if(!legacy.error)topProjectIds=legacy.data?.project_id?[legacy.data.project_id]:[]}renderProjectChoices()}}catch(e){console.warn('Top Airdrops selection unavailable',e)}}

function renderHighestScore(leader){currentRankingLeader=leader;const el=$('agHighestScore');el.replaceChildren(document.createTextNode('Highest Score '));const sep=()=>{const x=document.createElement('span');x.className='ag-score-separator';x.textContent='·';return x};el.append(sep(),document.createTextNode(' '));const project=projects.find(p=>String(p.name||'').trim().toLowerCase()===String(leader.name||'').trim().toLowerCase());const logoUrl=project?.logoUrl||project?.logo_url||leader.logo_url||leader.logoUrl||'';if(typeof logoUrl==='string'&&/^(https:\/\/|data:image\/(?:png|jpeg|webp);base64,)/i.test(logoUrl)){const logo=document.createElement('img');logo.className='ag-leader-logo';logo.src=logoUrl;logo.alt=String(leader.name||'')+' logo';logo.width=19;logo.height=19;logo.decoding='async';logo.onerror=()=>logo.remove();el.append(logo)}const name=document.createElement('span');name.className='ag-leader-name';name.textContent=String(leader.name||'');el.append(name,document.createTextNode(' '),sep(),document.createTextNode(' '));const score=document.createElement('span');score.className='ag-score-value';score.textContent=Number(leader.score)+'/100';el.append(score)}
async function loadRanking(){try{const r=await fetch('/api/score-ranking',{cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.error||'Unavailable');if(!j.leader){$('agHighestScore').textContent='Highest Score · Awaiting Scores';$('rankmeta').textContent='A project appears after a qualifying research report is saved.';return} renderHighestScore(j.leader);$('rankmeta').textContent=j.total+' Projects Analyzed · Updated '+new Date(j.leader.checked_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}catch(e){$('agHighestScore').textContent='Highest Score · Ranking unavailable';$('rankmeta').textContent='Ranking storage setup required; research remains available.'}}
function metric(label,value){return `<div class="metric"><div class="muted">${esc(label)}</div><div class="val">${esc(value||'Unavailable')}</div></div>`}
function cat(c){const pct=c.points===null?0:Math.round(c.points/c.weight*100);return `<div class="cat"><div class="cathead"><span>${esc(c.name)}</span><span>${c.points===null?'N/A':esc(c.points)+' / '+esc(c.weight)}</span></div><div class="bar"><i style="width:${pct}%"></i></div><p class="catdesc">${esc(c.detail)}</p>${(c.sources||[]).map(s=>`<a class="source" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.detail||'Research source')} ↗</a>`).join('')}</div>`}
function render(r,date){const m=r.metrics||{},services=r.research?.services||{};const sources=(r.evidence||[]).map(s=>`<a class="source" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.detail||s.url)} ↗</a>`).join('');$('report').innerHTML=`<section class="panel"><div class="headline"><div><h2>${esc(r.name)}</h2><p>Researched ${esc(new Date(date).toLocaleString())}</p></div><span class="pill">${esc(r.confidence)} confidence</span></div><div class="scores"><div class="scorebox"><strong>Project Score</strong><div class="number">${r.score===null?'N/A':esc(r.score)+'<small> / 100</small>'}</div><p class="muted">${esc(r.coverage)}/100 evidence coverage</p></div></div><p>${esc(r.summary)}</p></section><section class="panel"><h2>Market & On-chain Metrics</h2><div class="metricgrid">${metric('Market cap',m.marketCap)}${metric('24h token volume',m.tradingVolume)}${metric('Token price',m.price)}${metric('Protocol TVL',m.tvl)}</div><p class="muted" style="margin-top:12px">Token market activity is not the same as actual product adoption. TVL is relevant only to certain DeFi protocols.</p></section><section class="panel"><h2>Project Score Breakdown</h2>${(r.categories||[]).map(cat).join('')}</section><section class="panel"><h2>Risk Factors & Limitations</h2><p>${esc(r.risks?.summary||'Project risk cannot be determined reliably from these sources alone.')}</p><div class="note">${(r.risks?.limitations||[]).map(x=>`<div>• ${esc(x)}</div>`).join('')}<div style="margin-top:9px">Project Score reflects available research data, not a guarantee of safety, legitimacy, or future success.</div></div></section><section class="panel"><h2>Research Sources</h2>${sources||'<p>No independently matched sources available.</p>'}<h2 style="margin-top:24px">Data Sources Status</h2><div class="services">${Object.entries(services).map(([k,v])=>`<span class="service">${esc(k)}: ${esc(v)}</span>`).join('')}</div><div class="note">Project Score reflects available research data, not a guarantee of safety, legitimacy, or future success. This automated assessment is not a security audit or investment recommendation. Search excerpts may be outdated or incorrect. Review original sources before making decisions. N/A means insufficient evidence, not a score of zero. No GitHub signals are used.</div></section>`;$('report').classList.add('visible')}
$('listed').addEventListener('change',()=>{const p=projects.find(p=>String(p.id)===$('listed').value);if(p){$('name').value=p.name;$('website').value=links(p).find(u=>!/(twitter|x\.com|discord|t\.me|github|medium|docs\.)/i.test(u))||''}});
$('analyze').addEventListener('click',async()=>{const p=projects.find(p=>String(p.id)===$('listed').value);const name=$('name').value.trim()||(p?.name||'');if(!name||name.length>100){$('status').textContent='Enter a valid project name.';return}const website=$('website').value.trim();if(website&&!safeURL(website)){$('status').textContent='Enter an HTTPS official website URL (https://...).';return}const inputLinks=[...(website?[safeURL(website)]:[]),...(p?links(p):[])].filter(Boolean);$('analyze').disabled=true;$('status').textContent='Researching public sources. Please wait...';$('report').classList.remove('visible');try{const resp=await fetch('/api/project-score',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({projects:[{name,links:[...new Set(inputLinks)].slice(0,15)}]})});const json=await resp.json();if(!resp.ok)throw Error(json.error||`Research failed (${resp.status})`);if(!json.results?.[0])throw Error('No research report returned');render(json.results[0],json.checkedAt);loadRanking();$('status').textContent='Research completed. Scroll down for your report.';$('report').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){$('status').textContent=e.message||'Research unavailable'}finally{$('analyze').disabled=false}});
try{const cached=JSON.parse(localStorage.getItem('airgem.home.projects.v1')||'null');if(Array.isArray(cached?.projects)){projects=cached.projects;options();if(currentRankingLeader)renderHighestScore(currentRankingLeader)}}catch{}if(typeof dropyFetchProjects==='function'){dropyFetchProjects().then(rows=>{if(Array.isArray(rows)){projects=rows;options();if(currentRankingLeader)renderHighestScore(currentRankingLeader)}}).catch(()=>{if(!projects.length)options()})}else options();
loadTopProjects();loadRanking();const params=new URLSearchParams(location.search);if(params.get('name'))$('name').value=params.get('name').slice(0,100);if(params.get('url')&&safeURL(params.get('url')))$('website').value=params.get('url');
})();
</script></body></html>
