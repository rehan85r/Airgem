name: Admin regression tests

on:
  push:
    branches: [main]
    paths:
      - "admin-panel.html"
      - "admin.css"
      - "admin-app.js"
      - "admin-editor.js"
      - "supabase-data.js"
      - "tests/**"
      - ".github/workflows/admin-regression.yml"
  pull_request:
    paths:
      - "admin-panel.html"
      - "admin.css"
      - "admin-app.js"
      - "admin-editor.js"
      - "supabase-data.js"
      - "tests/**"
      - ".github/workflows/admin-regression.yml"

jobs:
  admin-browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Locate Chromium
        run: |
          echo "CHROMIUM_PATH=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
      - name: Run admin browser regression suite
        run: python tests/admin.spec.py
