    const daily=node.classList.contains('dh-daily-box');
    const heading=document.createElement('div');heading.className='dh-info-heading';
    const icon=document.createElement('span');icon.className='dh-info-icon';icon.setAttribute('aria-hidden','true');
    icon.innerHTML=daily?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8l4 4v14H4V3h4"/><path d="M8 12h8M8 16h6"/></svg>';
    const customTitle=daily?node.querySelector('.dh-custom-title'):null;
    const label=document.createElement('span');label.textContent=customTitle?.textContent.trim()||(daily?'Daily Task Update':'Important Note');
    if(customTitle)customTitle.remove();heading.append(icon,label);node.prepend(heading);continue}
  const plain=node.textContent.trim();const match=plain.match(/^(?:step\s*)?(\d+)\s*(?:[:.\-)]+\s*|\s+)(.+)$/i);
  if(node.classList.contains('guide-step-box')){if(!current){firstStepAnchor??=node;newStep()}current.append(node);continue}
  if(match&&['P','DIV','H2','H3','H4','STRONG'].includes(node.tagName)){
   firstStepAnchor??=node;
   // A numbered heading may appear after its Step Box in the editor HTML.
   // Attach it to the existing matching step instead of creating a duplicate at the end.
   const stepNumber=Number(match[1]);
   const existingStep=stepNumber>=1&&stepNumber<=count?timeline.children[stepNumber-1]:null;
   const existingContent=existingStep?.querySelector('.dh-step-content');
   const target=existingContent&&!existingContent.querySelector('.dh-step-title')?existingContent:newStep();
   const title=document.createElement('div');title.className='dh-step-title';title.textContent=match[2]||plain;
   target.prepend(title);node.remove();continue;
  }
  if(current&&!node.classList.contains('dh-info-box')&&['P','DIV','UL','OL','IMG'].includes(node.tagName)){if(!plain&&!node.querySelector('img,br')){node.remove();continue}current.append(node)}
 }
 finishTimeline();
 // Place informational cards after all steps, regardless of editor insertion order.
 for(const info of [...article.querySelectorAll(':scope > .dh-info-box')])article.append(info);
}

// Convert explicit UTC clock times in guides to the visitor's browser timezone.
// Admins keep writing canonical UTC times (e.g. 12:00 PM UTC).
function localizeGuideUtcTimes(container){
  const timezone=Intl.DateTimeFormat().resolvedOptions().timeZone||'Local time';
  const clock=new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit',hour12:true,timeZone:timezone});
  const re=/\b(0?[1-9]|1[0-2]):([0-5]\d)\s*(AM|PM)\s*(?:UTC|GMT)\b|\b([01]?\d|2[0-3]):([0-5]\d)\s*(?:UTC|GMT)\b/gi;
  const walker=document.createTreeWalker(container,NodeFilter.SHOW_TEXT);
  const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  for(const node of nodes){
    node.textContent=node.textContent.replace(re,(full,h12,m12,ampm,h24,m24)=>{
      const hour=h12!==undefined?(Number(h12)%12)+(ampm.toUpperCase()==='PM'?12:0):Number(h24);
      const minute=Number(m12??m24);
      const utc=new Date(Date.UTC(2026,0,15,hour,minute));
      return clock.format(utc)+' ('+timezone.replace(/_/g,' ')+')';
    });
  }
}
