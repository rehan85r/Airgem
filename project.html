<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><title>Project Details | DropyHub</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{font-family:Manrope,system-ui,sans-serif;color:#15243d;background:#f5f8ff}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-top:5px solid #2563eb;border-bottom:1px solid #e1e9f5}.head{max-width:1080px;margin:auto;min-height:84px;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:24px;font-weight:800;letter-spacing:-1px;color:#12243f;text-decoration:none}.brand span{color:#2563eb}.back{color:#2563eb;text-decoration:none;font-size:13px;font-weight:800;border:1px solid #dce7f7;padding:12px 16px;border-radius:12px}main{max-width:1080px;margin:40px auto;padding:0 22px 70px}.crumb{font-size:13px;color:#78869b;margin-bottom:20px}.panel{background:#fff;border:1px solid #e0e8f4;border-radius:22px;padding:30px;margin-bottom:24px;box-shadow:0 10px 30px rgba(23,65,134,.045)}.label{color:#2563eb;font-size:12px;letter-spacing:1.5px;font-weight:800;text-transform:uppercase;margin-bottom:18px}.identity{display:flex;align-items:center;gap:17px;min-width:0}.identity-info{flex:1;min-width:0}.logo{height:70px;width:70px;max-height:70px;max-width:70px;overflow:hidden;position:relative;border-radius:19px;color:#fff;font-size:28px;font-weight:800;display:grid;place-items:center;flex:0 0 70px}.logo img{display:block;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;border-radius:inherit;background:white}h1{font-size:clamp(24px,5vw,36px);letter-spacing:-1.3px;margin:0;overflow-wrap:anywhere;line-height:1.2}h2{font-size:23px;letter-spacing:-.7px;margin:0 0 10px}.muted{color:#758399;font-size:14px}.status{color:#2563eb;font-weight:800;font-size:14px;flex:0 1 auto;overflow-wrap:anywhere;text-align:right}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin-top:30px}.item{border:1px solid #e5ebf5;border-radius:14px;padding:18px;min-width:0}.item small{display:block;font-size:11px;color:#8390a3;font-weight:800;letter-spacing:.7px;text-transform:uppercase;margin-bottom:8px}.item strong{font-size:14px;overflow-wrap:anywhere}.desc{margin:25px 0 0;color:#526179;line-height:1.8;font-size:14px}.guide-intro{color:#718097;font-size:14px;line-height:1.8}.steps{display:grid;gap:12px;margin-top:23px}.step{display:flex;align-items:flex-start;gap:14px;padding:18px;border:1px solid #e5ebf5;border-radius:14px}.num{display:grid;place-items:center;flex:0 0 32px;height:32px;background:#eaf2ff;color:#2563eb;border-radius:10px;font-weight:800}.step p{margin:4px 0 0;color:#54647c;line-height:1.7;font-size:14px}.empty{border:1px dashed #cbd9ef;border-radius:14px;background:#f8fbff;padding:22px;color:#6d7d96;font-size:14px;line-height:1.8}.links a{display:inline-block;color:#2563eb;font-size:13px;font-weight:800;margin:14px 16px 0 0;overflow-wrap:anywhere}.note{font-size:12px;color:#8490a1;margin-top:25px}@media(max-width:640px){main{margin-top:24px;padding:0 15px 40px}.panel{padding:21px;border-radius:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.item{padding:13px}.head{padding:13px 16px}.brand{font-size:21px}.identity{display:grid;grid-template-columns:64px minmax(0,1fr);align-items:center;gap:12px}.logo{height:64px;width:64px;max-height:64px;max-width:64px;flex-basis:64px;border-radius:15px}.identity-info{min-width:0}.identity h1{font-size:clamp(20px,5.4vw,29px);letter-spacing:-.8px}.status{grid-column:2;text-align:left;font-size:13px}.back{padding:10px;font-size:11px}}
</style></head><body><header><div class="head"><a class="brand" href="index.html">Dropy<span>Hub</span></a><a class="back" href="index.html">← Back to Projects</a></div></header><main><div class="crumb">Home / Project Details</div><section class="panel"><div class="label">Project Details</div><div class="identity"><div class="logo" id="logo">D</div><div class="identity-info"><h1 id="name">Project</h1><div class="muted" id="subtitle"></div></div><div class="status" id="status"></div></div><div class="grid" id="details"></div><p class="desc" id="description"></p><div class="links" id="links"></div></section><section class="panel"><div class="label">Step-by-Step</div><h2>Project Guide</h2><div id="guide"></div></section><div class="note">Project data demo ho sakta hai. Official links aur instructions verify karein.</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="supabase-config.js"></script><script src="supabase-data.js"></script><script src="projects.js"></script><script>
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=Number(new URLSearchParams(location.search).get('id'));async function showProject(){let p;try{p=(await dropyFetchProjects()).find(x=>x.id===id)}catch(e){document.querySelector('main').innerHTML='<div class="panel">Unable to load project. Please refresh.</div>';return}
if(!p){document.querySelector('main').innerHTML='<div class="panel"><h1>Project not found</h1><p class="muted">Please return to the homepage and select a project.</p><a class="back" href="index.html">Back to Projects</a></div>'}else{
document.title=p.name+' | DropyHub';document.getElementById('name').textContent=p.name;document.getElementById('subtitle').textContent=p.task;document.getElementById('status').textContent=p.status==='Confirm'?'Confirmed':p.status;const logo=document.getElementById('logo');logo.textContent=p.name[0];logo.style.background=p.color||'#2563eb';if(p.logoUrl&&/^(https:\/\/|data:image\/(?:png|jpeg|webp);base64,)/i.test(p.logoUrl)){const img=document.createElement('img');img.src=p.logoUrl;img.alt=p.name+' logo';img.onerror=()=>img.remove();logo.append(img)}document.getElementById('description').textContent=p.description||'';
const fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'Not available';
const fields=[['Task',p.task],['Cost',p.cost||'—'],['Time',p.time||'—'],['Reward',p.status==='Confirm'?'Confirmed':p.status],['Funding',p.funding],['Added On',fmt(p.addedOn||'2026-10-11')]];document.getElementById('details').innerHTML=fields.map(([k,v])=>`<div class="item"><small>${esc(k)}</small><strong>${esc(v||'Not disclosed')}</strong></div>`).join('');
const steps=Array.isArray(p.guide)?p.guide:[];document.getElementById('guide').innerHTML=steps.length?'<div class="steps">'+steps.map((s,i)=>`<div class="step"><div class="num">${i+1}</div><div><strong>${esc(s.title||'Step '+(i+1))}</strong><p>${esc(s.text||'')}</p></div></div>`).join('')+'</div>':'<div class="empty">Guide coming soon. Website owner yahan project join karne ke steps add karega.</div>';
const links=Array.isArray(p.links)?p.links:[];document.getElementById('links').innerHTML=links.filter(l=>{try{return ['https:','http:'].includes(new URL(l.url).protocol)}catch{return false}}).map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label||'Official Link')} ↗</a>`).join('');}
}showProject();</script></body></html>
