function safeGuide(html){const doc=new DOMParser().parseFromString(html,'text/html');const allowed=new Set(['P','DIV','BR','H2','H3','H4','STRONG','B','EM','I','U','A','IMG','UL','OL','LI','BLOCKQUOTE']);function walk(el){for(const node of [...el.childNodes]){if(node.nodeType===8){node.remove();continue}if(node.nodeType!==1)continue;if(!allowed.has(node.tagName)){const fragment=doc.createDocumentFragment();while(node.firstChild)fragment.appendChild(node.firstChild);node.replaceWith(fragment);walk(el);continue}const isCustomTitle=node.classList.contains('dh-custom-title'),isCustomBody=node.classList.contains('dh-custom-body');const href=node.getAttribute('href'),src=node.getAttribute('src'),alt=node.getAttribute('alt'),alignment=(node.style.textAlign||'').toLowerCase(),isStepBox=node.tagName==='DIV'&&node.classList.contains('guide-step-box'),infoType=node.tagName==='DIV'&&(node.classList.contains('dh-daily-box')?'dh-daily-box':node.classList.contains('dh-note-box')?'dh-note-box':'');for(const attr of [...node.attributes])node.removeAttribute(attr.name);if(isStepBox)node.className='guide-step-box';if(infoType)node.className='dh-info-box '+infoType;if(node.tagName==='DIV'&&isCustomTitle)node.className='dh-custom-title';if(node.tagName==='DIV'&&isCustomBody)node.className='dh-custom-body';if(['left','center','right'].includes(alignment)&&['P','DIV','H2','H3','H4','BLOCKQUOTE','LI'].includes(node.tagName))node.style.textAlign=alignment;if(node.tagName==='A'&&/^https?:\/\//i.test(href||'')){node.setAttribute('href',href);node.setAttribute('target','_blank');node.setAttribute('rel','noopener noreferrer')}if(node.tagName==='IMG'){if(/^https?:\/\//i.test(src||'')){node.setAttribute('src',src);node.setAttribute('alt',alt||'Guide image');node.setAttribute('loading','lazy')}else{node.remove();continue}}walk(node)}}walk(doc.body);return doc.body.innerHTML}

// Build the numbered timeline from existing guide paragraphs and clickable step boxes. Supports 'Step 1:' and '1.' formats.
function upgradeGuideTimeline(root){
 const article=root.querySelector('.guide-article');if(!article)return;
 // Work from a snapshot: editor content may contain headings after their link boxes.
 const blocks=[...article.childNodes].filter(n=>n.nodeType===1||(n.nodeType===3&&n.textContent.trim()));
 const timeline=document.createElement('div');timeline.className='dh-timeline';
 const stepMap=new Map();let maxStep=0;
 const ensureStep=n=>{
   if(!stepMap.has(n)){
     const step=document.createElement('div');step.className='dh-step';
     const number=document.createElement('span');number.className='dh-step-number';number.textContent=String(n).padStart(2,'0');
     const content=document.createElement('div');content.className='dh-step-content';step.append(number,content);
     stepMap.set(n,{step,content});
   }
   maxStep=Math.max(maxStep,n);return stepMap.get(n).content;
 };
 const numbered=/^(?:step\s*)?(\d+)\s*(?:[.:)\-]\s*|\s+)(.+)$/i;
 // First pass: resolve ALL numbered titles before moving any buttons.
 for(const node of blocks){
   if(node.nodeType!==1||node.classList.contains('guide-step-box')||node.classList.contains('dh-info-box'))continue;
   const raw=node.textContent.replace(/\u00a0/g,' ').trim();
   const match=raw.match(numbered);
   if(!match||Number(match[1])<1||Number(match[1])>99)continue;
   const content=ensureStep(Number(match[1]));
   const title=document.createElement('div');title.className='dh-step-title';title.textContent=match[2];
   const old=content.querySelector('.dh-step-title');if(old)old.remove();content.prepend(title);
   node.remove();
 }
 // Second pass: put step buttons in sequence, starting at 01, independent of their DOM order.
 let buttonIndex=0;let currentStep=1;
 for(const node of blocks){
   if(!node.isConnected)continue;
   if(node.nodeType===1&&node.classList.contains('guide-step-box')){
     buttonIndex++;
     // Attach the first button to step 01; later buttons to the next available step.
     const dest=ensureStep(buttonIndex);dest.append(node);currentStep=buttonIndex;continue;
   }
   if(node.nodeType===1&&node.classList.contains('dh-info-box')){
     const daily=node.classList.contains('dh-daily-box');
     const heading=document.createElement('div');heading.className='dh-info-heading';
     const icon=document.createElement('span');icon.className='dh-info-icon';icon.setAttribute('aria-hidden','true');
     icon.innerHTML=daily?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/><path d="m9 15 2 2 4-4"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/></svg>';
     const customTitle=daily?node.querySelector('.dh-custom-title'):null;
     const label=document.createElement('span');label.textContent=customTitle?.textContent.trim()||(daily?'Daily Task Update':'Important Note');
     if(customTitle)customTitle.remove();heading.append(icon,label);node.prepend(heading);continue;
   }
 }
 if(stepMap.size){
   for(const n of [...stepMap.keys()].sort((x,y)=>x-y))timeline.append(stepMap.get(n).step);
   article.prepend(timeline);
 }
}

// Convert explicit UTC clock times in guides to the visitor's browser timezone.
// Admins keep writing canonical UTC times (e.g. 12:00 PM UTC).
function localizeGuideUtcTimes(container){
  const timezone=Intl.DateTimeFormat().resolvedOptions().timeZone||'Local time';
  const clock=new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit',hour12:true,timeZone:timezone});
  const re=/\b(0?[1-9]|1[0-2]):([0-5]\d)\s*(AM|PM)\s*(?:UTC|GMT)\b|\b([01]?\d|2[0-3]):([0-5]\d)\s*(?:UTC|GMT)\b/gi;
  const walker=document.createTreeWalker(container,NodeFilter.SHOW_TEXT);
  const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  for(const node of nodes){
    node.textContent=node.textContent.replace(re,(full,h12,m12,ampm,h24,m24)=>{
      const hour=h12!==undefined?(Number(h12)%12)+(ampm.toUpperCase()==='PM'?12:0):Number(h24);
      const minute=Number(m12??m24);
      const utc=new Date(Date.UTC(2026,0,15,hour,minute));
      return clock.format(utc)+' ('+timezone.replace(/_/g,' ')+')';
    });
  }
}
