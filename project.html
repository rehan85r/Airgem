<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><title>Project Details | DropyHub</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{font-family:Manrope,system-ui,sans-serif;color:#142746;background:#f5f8fe}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f6f9ff,#f1f6fe);min-height:100vh;-webkit-font-smoothing:antialiased}header{background:#ffffffed;border-top:4px solid #2563eb;border-bottom:1px solid #e5ecf7}.head{max-width:1050px;margin:auto;min-height:76px;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:25px;font-weight:800;letter-spacing:-1.3px;color:#132641;text-decoration:none}.brand span{color:#2563eb}.back{color:#2563eb;text-decoration:none;font-size:12px;font-weight:800;border:1px solid #dce7f7;background:#fff;padding:12px 16px;border-radius:12px;transition:background .2s}.back:hover{background:#edf4ff}main{max-width:1050px;margin:32px auto;padding:0 24px 65px}.crumb{font-size:12px;color:#8491a7;margin-bottom:20px}.panel{background:linear-gradient(140deg,#fff 0%,#fcfdff 70%,#f4f8ff 100%);border:1px solid #e1e9f6;border-radius:23px;padding:32px;margin-bottom:20px;box-shadow:0 14px 38px rgba(27,66,128,.055)}.label{color:#2563eb;font-size:11px;letter-spacing:1.6px;font-weight:800;text-transform:uppercase;margin-bottom:23px}.identity{display:flex;align-items:center;gap:18px;min-width:0}.identity-info{flex:1;min-width:0}.logo{height:78px;width:78px;overflow:hidden;position:relative;border-radius:19px;color:#fff;font-size:30px;font-weight:800;display:grid;place-items:center;flex:0 0 78px;background:#2563eb;isolation:isolate}.logo img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;background:#fff;border-radius:inherit}h1{font-size:clamp(23px,4vw,34px);letter-spacing:-1.3px;margin:0;overflow-wrap:anywhere;line-height:1.18}h2{font-size:21px;letter-spacing:-.7px;margin:0 0 10px}.muted{color:#8a97ab;font-size:13px;margin-top:7px;font-weight:600}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:28px}.item{border:1px solid #e7edf7;border-radius:13px;padding:16px 10px;min-width:0;min-height:92px;background:linear-gradient(145deg,#f9fbff,#f3f7fe);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:9px;box-shadow:inset 0 1px 0 #fff}.item small{display:block;font-size:10px;color:#8593aa;font-weight:800;letter-spacing:.075em;text-transform:uppercase}.item strong{font-size:15px;color:#1b2e50;font-weight:800;overflow-wrap:anywhere;line-height:1.3}.desc{margin:28px 0 0;color:#53637b;line-height:1.8;font-size:14px}.steps{display:grid;gap:11px;margin-top:21px}.step{display:flex;align-items:flex-start;gap:13px;padding:16px;border:1px solid #e7edf7;background:#f9fbff;border-radius:13px}.num{display:grid;place-items:center;flex:0 0 31px;height:31px;background:#eaf2ff;color:#2563eb;border-radius:9px;font-weight:800}.step p{margin:4px 0 0;color:#566780;line-height:1.7;font-size:13px}.empty{border:1px dashed #cbd9ef;border-radius:13px;background:#f8fbff;padding:20px;color:#72819a;font-size:13px;line-height:1.8}.links a{display:inline-flex;color:#2563eb;font-size:13px;font-weight:800;margin:15px 16px 0 0;overflow-wrap:anywhere}.note{font-size:11px;color:#8995a8;margin-top:20px;line-height:1.7}@media(max-width:640px){main{margin-top:22px;padding:0 15px 42px}.panel{padding:19px;border-radius:19px}.head{padding:12px 16px;min-height:72px}.brand{font-size:21px}.back{padding:10px 11px;font-size:11px}.identity{gap:12px}.logo{height:65px;width:65px;flex-basis:65px;border-radius:16px}.identity h1{font-size:clamp(20px,5.2vw,27px);letter-spacing:-.8px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:25px}.item{min-height:78px;padding:12px 7px;gap:7px}.item small{font-size:10px;letter-spacing:.035em}.item strong{font-size:13px}.desc{margin-top:23px;font-size:13px}}
</style></head><body><header><div class="head"><a class="brand" href="index.html">Dropy<span>Hub</span></a><a class="back" href="index.html">← Back to Projects</a></div></header><main><div class="crumb">Home / Project Details</div><section class="panel"><div class="label">Project Details</div><div class="identity"><div class="logo" id="logo">D</div><div class="identity-info"><h1 id="name">Project</h1><div class="muted" id="subtitle"></div></div></div><div class="grid" id="details"></div><p class="desc" id="description"></p><div class="links" id="links"></div></section><section class="panel"><div class="label">Step-by-Step</div><h2>Project Guide</h2><div id="guide"></div></section><div class="note">Always verify official project links and instructions before participating.</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="supabase-config.js"></script><script src="supabase-data.js"></script><script src="projects.js"></script><script>
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=Number(new URLSearchParams(location.search).get('id'));async function showProject(){let p;try{p=(await dropyFetchProjects()).find(x=>x.id===id)}catch(e){document.querySelector('main').innerHTML='<div class="panel">Unable to load project. Please refresh.</div>';return}
if(!p){document.querySelector('main').innerHTML='<div class="panel"><h1>Project not found</h1><p class="muted">Please return to the homepage and select a project.</p><a class="back" href="index.html">Back to Projects</a></div>';return}
document.title=p.name+' | DropyHub';document.getElementById('name').textContent=p.name;document.getElementById('subtitle').textContent=p.task||'';const logo=document.getElementById('logo');logo.textContent=(p.name||'D').charAt(0).toUpperCase();logo.style.background=p.color||'#2563eb';
if(p.logoUrl&&/^(https:\/\/|data:image\/(?:png|jpeg|webp);base64,)/i.test(p.logoUrl)){const img=document.createElement('img');img.src=p.logoUrl;img.alt=p.name+' logo';img.onload=()=>{logo.replaceChildren(img)};img.onerror=()=>{img.remove()}}
document.getElementById('description').textContent=p.description||'';
const fmt=d=>{if(!d)return'Not available';const v=new Date(d+'T12:00:00');return Number.isNaN(v.getTime())?'Not available':v.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})};
const fields=[['Task',p.task],['Cost',p.cost||'—'],['Time',p.time||'—'],['Reward',p.status==='Confirm'?'Confirmed':p.status],['Funding',p.funding],['Added On',fmt(p.addedOn)]];document.getElementById('details').innerHTML=fields.map(([k,v])=>`<div class="item"><small>${esc(k)}</small><strong>${esc(v||'Not disclosed')}</strong></div>`).join('');
const steps=Array.isArray(p.guide)?p.guide:[];document.getElementById('guide').innerHTML=steps.length?'<div class="steps">'+steps.map((s,i)=>`<div class="step"><div class="num">${i+1}</div><div><strong>${esc(s.title||'Step '+(i+1))}</strong><p>${esc(s.text||'')}</p></div></div>`).join('')+'</div>':'<div class="empty">Guide coming soon. Website owner yahan project join karne ke steps add karega.</div>';
const links=Array.isArray(p.links)?p.links:[];document.getElementById('links').innerHTML=links.filter(l=>{try{return ['https:','http:'].includes(new URL(l.url).protocol)}catch{return false}}).map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label||'Official Link')} ↗</a>`).join('');
}showProject();</script></body></html>
