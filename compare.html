<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1E90FF"><title>Live Project Score | Airgem</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{font-family:Manrope,system-ui,sans-serif;color:#152a47;background:#f6f9fe}*{box-sizing:border-box}body{margin:0}header{background:white;border-bottom:1px solid #e3eaf5}.head{max-width:1050px;margin:auto;padding:16px 22px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:23px;text-decoration:none;color:#152a47;display:flex;align-items:center;gap:9px}.brand img{width:36px;height:36px;border-radius:9px}.back{color:#1E90FF;font-weight:800;text-decoration:none;font-size:12px}main{max-width:1050px;margin:auto;padding:35px 22px 60px}h1{font-size:clamp(25px,4vw,34px);letter-spacing:-1px;margin:0 0 8px}p{color:#728198;line-height:1.65;margin:0}.intro{margin-bottom:24px}.panel{background:white;border:1px solid #e1eaf5;border-radius:19px;padding:22px;margin-bottom:18px}.pickers,.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field label{display:block;font-size:12px;font-weight:800;color:#71849b;margin-bottom:9px}.field select{width:100%;padding:13px 10px;border:1px solid #dbe5f3;border-radius:11px;background:white;font:600 13px Manrope;color:#1c3150;min-width:0}.action{width:100%;margin-top:17px;background:#1E90FF;color:#fff;border:0;border-radius:11px;padding:14px;font:800 13px Manrope;cursor:pointer}.action:disabled{opacity:.5}.message{font-size:12px;margin-top:12px}.results{display:none}.results.visible{display:block}.score-card{border:1px solid #e2eaf4;border-radius:14px;padding:19px;min-width:0}.score-card h2{font-size:17px;margin:0 0 12px;overflow-wrap:anywhere}.score{font-size:34px;font-weight:800;color:#1E90FF}.score small{font-size:14px;color:#7e8ba0}.muted{color:#71849a;font-size:12px;line-height:1.6}.label{display:inline-block;font-size:11px;font-weight:800;background:#edf5ff;color:#206bb5;border-radius:7px;padding:5px 8px;margin:8px 0}.evidence{margin-top:15px;padding-top:12px;border-top:1px solid #e9eef5}.evidence h3{font-size:12px;margin:0 0 9px}.evidence a{display:block;font-size:12px;color:#176fb8;overflow-wrap:anywhere;margin:7px 0;text-decoration:none}.evidence .item{font-size:12px;color:#526580;margin:9px 0}.go{display:inline-block;margin-top:12px;color:#1E90FF;text-decoration:none;font-size:12px;font-weight:800}.notice{padding:14px;background:#f6f9fe;border:1px solid #e7eef8;border-radius:11px;font-size:12px;color:#667990;line-height:1.65;margin-top:16px}.compare-table{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:20px}.compare-table td,.compare-table th{padding:12px 6px;border-bottom:1px solid #edf1f7;font-size:12px;text-align:center;overflow-wrap:anywhere}.compare-table th:first-child{width:30%;text-align:left;color:#71839a}.compare-table td{font-weight:700}@media(max-width:600px){main{padding:25px 14px 40px}.head{padding:14px}.panel{padding:15px}.pickers,.score-grid{gap:9px}.field select{font-size:11px;padding:11px 6px}.score-card{padding:13px}.score-card h2{font-size:14px}.score{font-size:27px}.compare-table td,.compare-table th{font-size:10px}}
</style></head><body><header><div class="head"><a href="index.html" class="brand"><img src="airgem-logo.png" alt="" onerror="this.style.display='none'">Airgem</a><a href="index.html" class="back">← Back to Projects</a></div></header><main><div class="intro"><h1>Live Project Score</h1><p>Compare public development, adoption and independent evidence. Scores appear only when enough verifiable signals are available.</p></div><section class="panel"><div class="pickers"><div class="field"><label for="first">Project 1</label><select id="first"><option>Loading...</option></select></div><div class="field"><label for="second">Project 2</label><select id="second"><option>Loading...</option></select></div></div><button class="action" id="compare" disabled>Research & Compare →</button><p class="message" id="message" role="status">Loading projects...</p></section><section class="panel results" id="results" aria-live="polite"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="supabase-config.js"></script><script src="supabase-data.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let projects=[];const options=()=>'<option value="">Select a project...</option>'+projects.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');function populate(){const o=options();$('first').innerHTML=o;$('second').innerHTML=o;$('compare').disabled=projects.length<2;$('message').textContent=projects.length<2?'At least two projects are needed.':'Choose two projects to research their public signals.'}
function projectLinks(p){const raw=p.links||[];let arr=Array.isArray(raw)?raw:Object.values(raw||{});return arr.flatMap(x=>{if(typeof x==='string')return[x];if(x&&typeof x==='object')return[x.url,x.href,x.link].filter(Boolean);return[]}).filter(x=>typeof x==='string'&&/^https:\/\//i.test(x)).slice(0,15)}
function tile(p,r){const sources=(r.evidence||[]).map(e=>`<div class="item">${esc(e.detail)}<a href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">Source ↗</a></div>`).join('');const findings=(r.findings||[]).map(x=>`<div class="item">${esc(x)}</div>`).join('');return `<article class="score-card"><h2>${esc(p.name)}</h2><div class="score">${r.score===null?'N/A':esc(r.score)}${r.score===null?'':'<small>/100</small>'}</div><span class="label">${esc(r.confidence||'Insufficient evidence')} confidence</span><p class="muted">${esc(r.summary||'Not enough independently verified information to calculate a score.')}</p><div class="evidence"><h3>Public signals</h3>${findings||'<div class="item">No independently matched metrics available.</div>'}<h3>Evidence links</h3>${sources||'<div class="item">No independent source match.</div>'}</div><a class="go" href="project.html?id=${encodeURIComponent(p.id)}">View Project →</a></article>`}
async function compare(){const a=projects.find(p=>String(p.id)===$('first').value),b=projects.find(p=>String(p.id)===$('second').value);if(!a||!b||String(a.id)===String(b.id)){$('message').textContent='Select two different projects.';return}$('compare').disabled=true;$('message').textContent='Checking free public sources...';try{const payload=[a,b].map(p=>({name:p.name,links:projectLinks(p)}));const res=await fetch('/api/project-score',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({projects:payload})});if(!res.ok)throw Error('Research service unavailable ('+res.status+').');const json=await res.json();if(!Array.isArray(json.results)||json.results.length!==2)throw Error('Invalid response');const [x,y]=json.results;$('results').innerHTML=`<div class="score-grid">${tile(a,x)}${tile(b,y)}</div><table class="compare-table"><tbody><tr><th>Signal</th><td>${esc(a.name)}</td><td>${esc(b.name)}</td></tr><tr><th>GitHub development</th><td>${esc(x.metrics?.github||'Unavailable')}</td><td>${esc(y.metrics?.github||'Unavailable')}</td></tr><tr><th>DeFi TVL</th><td>${esc(x.metrics?.tvl||'Unavailable')}</td><td>${esc(y.metrics?.tvl||'Unavailable')}</td></tr><tr><th>X trends / joined users</th><td>Not verified</td><td>Not verified</td></tr></tbody></table><div class="notice"><b>Methodology:</b> Scores require both a linked public GitHub repository and an independently matched DefiLlama protocol with measurable TVL. Development (45), on-chain TVL (35) and public project signals (20) form an evidence score, not an audit, verification badge, social sentiment rating or return prediction. If either source is unavailable, the score is withheld. Data is cached up to 24 hours; “live” means refreshed public-source data, not continuous real-time monitoring. X trends, participant counts and narrative strength are not scored without trustworthy data.</div>`;$('results').classList.add('visible');$('message').textContent='Research complete. Checked '+new Date(json.checkedAt).toLocaleString()+'.'}catch(e){$('message').textContent=e.message+' Check that api/project-score.js is deployed on Vercel.';console.error(e)}finally{$('compare').disabled=false}}
$('compare').addEventListener('click',compare);try{const cached=JSON.parse(localStorage.getItem('airgem.home.projects.v1')||'null');if(cached&&Array.isArray(cached.projects)){projects=cached.projects;populate()}}catch{}dropyFetchProjects().then(rows=>{projects=rows;populate()}).catch(e=>{$('message').textContent=projects.length?'Showing cached project list.':'Unable to load projects.';console.error(e)});
})();
</script></body></html>
