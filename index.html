let trendingProjectIds=[],trendingSelectionLoaded=false;let task='All',status='All';const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));/* AIRGEM CONTENT MODEL: Category/listing = All Airdrops (all projects); featured = Top Airdrops (curated carousel); Type = Testnet, Mainnet, Points, Whitelist. 'All' is a filter sentinel, NOT a project type. Keep legacy project.task field for stored-data compatibility. */const cats=['Testnet','Mainnet','Points','Whitelist'];const taskTypes=['All','Testnet','Mainnet','Points','Whitelist'];const statuses=['All','Confirmed','Potential'];const statusIcons={All:'grid',Potential:'help',Confirm:'check',End:'stop',};

};

function filterIcon(name){const [fg,bg]=filterColors[name]||filterColors.All;return `<span class="filter-icon" style="--icon-fg:${fg};--icon-bg:${bg}" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${filterPaths[name]||filterPaths.All}</svg></span>`}

function logo(p){const url=p.logoUrl&&/^(https:\/\/|data:image\/(?:png|jpeg|webp);base64,)/i.test(p.logoUrl)?p.logoUrl:null;return `<div class="project-icon" style="background:${/^#[0-9a-f]{3}(?:[0-9a-f]{3})?$/i.test(String(p.color||''))?p.color:'#1E90FF'}">${url?`<img src="${esc(url)}" alt="${esc(p.name)} logo" loading="lazy" style="width:100%;height:100%;object-fit:contain;border-radius:inherit;background:white" onerror="this.style.display='none';this.parentNode.append(document.createTextNode(${JSON.stringify("?")}))">`:esc(p.name[0])}</div>`}function badge(p){return `<span class="status ${esc(p.status)}">${esc(p.status==='Confirm'?'Confirmed':p.status)}</span>`}function agNewBadge(p){if(!p.addedOn)return '';const raw=String(p.addedOn).trim();const m=raw.match(/^(\d{4})-(\d{2})-(\d{2})/);if(!m)return '';const created=Date.UTC(+m[1],+m[2]-1,+m[3]);if(!Number.isFinite(created))return '';const age=Math.floor((Date.now()-created)/86400000);return age>=0&&age<7?'<span class="ag-new-badge" aria-label="Newly added">NEW</span>':''}function card(p){return `<article class="project-card ag-card"><div class="ag-card-head">${logo(p)}<div class="ag-identity"><div class="ag-name-line"><div class="card-name">${esc(p.name)}</div>${agNewBadge(p)}</div><div class="micro">${esc(p.displayTag||p.task)}</div></div><span class="ag-reward-note ag-head-status ${agActivity(p)==='Ended'?'ag-ended':'ag-active'}"><i></i>${esc(agActivity(p))}</span></div><div class="ag-stats">${agMetrics(p)}</div><div class="ag-card-foot"><button class="ag-join details" data-id="${esc(p.id)}">View Details <span class="ag-join-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></span></button></div></article>`}
function agMetrics(p){const rows=[["Type",p.task],["TGE",p.tge||"Not Announced"],["Cost",p.cost||"—"],["Reward",p.status==="Confirm"?"Confirmed":p.status],["Funding",p.funding||"N/A"],["Added",formatAdded(p.addedOn)]];const icons={"Type": `<i data-lucide="layout-grid" aria-hidden="true"></i>`,"TGE": `<i data-lucide="coins" aria-hidden="true"></i>`,"Cost": `<i data-lucide="circle-dollar-sign" aria-hidden="true"></i>`,"Reward": `<i data-lucide="gift" aria-hidden="true"></i>`,"Funding": `<i data-lucide="landmark" aria-hidden="true"></i>`,"Added": `<i data-lucide="calendar-plus" aria-hidden="true"></i>`};return rows.map(([label,value])=>`<div class="ag-stat"><span class="ag-stat-label">${icons[label]}${label}</span><strong>${esc(value)}</strong></div>`).join("")}
function featuredCard(p){return `<article class="feature ag-card ag-feature"><div class="ag-card-head">${logo(p)}<div class="ag-identity"><div class="ag-name-line"><h3 class="card-name">${esc(p.name)}</h3>${agNewBadge(p)}</div><div class="micro">${esc(p.displayTag||p.task)}</div></div><span class="ag-reward-note ag-head-status ${agActivity(p)==='Ended'?'ag-ended':'ag-active'}"><i></i>${esc(agActivity(p))}</span></div><div class="ag-stats">${agMetrics(p)}</div><div class="ag-card-foot"><button class="ag-join details" data-id="${esc(p.id)}">View Details <span class="ag-join-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></span></button></div></article>`}
function render(){const matches=getMatches();const featured=trendingProjectIds.map(id=>data.find(p=>String(p.id)===String(id))).filter(Boolean).slice(0,10);if(!trendingSelectionLoaded&&!featured.length&&data.length)featured.push(data[0]);const featuredIds=new Set(featured.map(p=>String(p.id)));const searching=Boolean($('search').value.trim());const explore=searching?matches:matches.filter(p=>!featuredIds.has(String(p.id)));document.querySelector('.trending-heading').style.display=searching?'none':'';$('featured').style.display=searching?'none':'';$('featured').innerHTML=featured.length?`<div class="trending-slider" tabindex="0" aria-label="Trending projects, swipe left or right"><div class="trending-track">${featured.map(p=>`<div class="trending-slide">${featuredCard(p)}</div>`).join('')}</div></div>`:`<div class="empty" style="margin-bottom:35px">No trending projects selected</div>`;$('trendingHeaderControls').innerHTML=featured.length>1?`<div class="trending-controls"><button type="button" id="trendPrev" aria-label="Previous trending project"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button><span id="trendPosition">1 / ${featured.length}</span><button type="button" id="trendNext" aria-label="Next trending project"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button></div>`:'';$('projects').innerHTML=explore.map(card).join('')||(searching?'<div class="empty">No projects found.</div>':'<div class="empty">No more projects match your selection.</div>');$('count').textContent=`${explore.length} ${explore.length===1?'PROJECT':'PROJECTS'}`;$('listTitle').textContent=searching?'Search Results':(task==='All'?'All Airdrops':task);document.querySelectorAll('[data-id]').forEach(b=>b.onclick=e=>{e.stopPropagation();goProject(b.dataset.id)});document.querySelectorAll('.project-card,.feature').forEach(el=>{const btn=el.querySelector('[data-id]');if(btn){el.style.cursor='pointer';el.tabIndex=0;el.setAttribute('role','link');el.onclick=()=>goProject(btn.dataset.id);el.onkeydown=e=>{if(e.key==='Enter')goProject(btn.dataset.id)}}});const slider=document.querySelector('.trending-slider');if(slider&&featured.length>1){let position=0;const update=()=>{position=Math.max(0,Math.min(featured.length-1,Math.round(slider.scrollLeft/(slider.querySelector('.trending-slide')?.offsetWidth+20||slider.clientWidth))));$('trendPosition').textContent=`${position+1} / ${featured.length}`};const move=d=>slider.scrollTo({left:Math.max(0,Math.min(featured.length-1,position+d))*(slider.querySelector('.trending-slide')?.offsetWidth+20||slider.clientWidth),behavior:'smooth'});$('trendPrev').onclick=()=>move(-1);$('trendNext').onclick=()=>move(1);slider.addEventListener('scroll',update,{passive:true});slider.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();move(1)}if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}})};if(window.lucide)window.lucide.createIcons({attrs:{'stroke-width':1.8}})}

document.querySelectorAll('#agCategoryTabs [data-task]').forEach(b=>b.onclick=()=>setCategory(b.dataset.task));$('openMenu').onclick=()=>toggleMenu(true);$('closeMenu').onclick=()=>toggleMenu(false);$('overlay').onclick=()=>toggleMenu(false);$('search').oninput=render;$('closeModal').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};document.addEventListener('click',e=>{if(!e.target.closest('.custom-select'))document.querySelectorAll('.custom-select').forEach(x=>{x.classList.remove('open');x.querySelector('.select-trigger').setAttribute('aria-expanded','false')})});document.addEventListener('keydown',e=>{if(e.key==='Escape'){toggleMenu(false);closeModal();}});refreshSelects();const agCached=agReadCache();if(agCached){data.splice(0,data.length,...agCached.projects);trendingProjectIds=agCached.trending||[];trendingSelectionLoaded=!!agCached.loaded;}if(data.length){render()}else{const skeleton='<div class="ag-load-card"><div class="ag-load-line" style="width:56%;height:22px"></div><div class="ag-load-line" style="width:35%"></div><div class="ag-load-line" style="width:88%;margin-top:30px"></div><div class="ag-load-line" style="width:75%"></div></div>';$('featured').innerHTML=skeleton;$('projects').innerHTML=skeleton+skeleton;$('count').textContent='Loading projects…'}
